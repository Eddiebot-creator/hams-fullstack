services:
  - type: web
    name: hams-fullstack
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      npm ci
      npm run build
    startCommand: gunicorn server.app:app
    envVars:
      - key: STATIC_DIR
        value: /opt/render/project/src/dist
      - key: APP_TIMEZONE
        value: Africa/Lagos
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
